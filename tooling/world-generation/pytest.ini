[pytest]
testpaths = worldgen
# The default run excludes `slow`: tests that re-grade or re-solve a full
# 4033x4033 province raster. They are real gates, not optional — they run in
# `npm run test:placement:slow`. Everything else must stay fast enough to run
# on every change.
addopts = -m "not slow"
markers =
    slow: re-computes a full province raster; excluded from the default run
    real_index: opts out of a suite's synthetic autouse fixtures; the test
        measures the real committed data
