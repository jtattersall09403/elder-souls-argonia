[pytest]
; pipeline/blender/ holds scripts executed inside Blender (import bpy); the
; *_test.py naming there is not a pytest test. Collect only the pipeline tests.
testpaths = pipeline
norecursedirs = pipeline/blender prototypes
markers =
    slow: a test over ~30 s (Blender); the full run keeps it, a scoped
        preflight deselects it unless its own inputs changed
        (tooling/world-generation/scripts/select_tests.py)
