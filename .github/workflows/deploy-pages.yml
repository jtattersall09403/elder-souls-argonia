name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  placement-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/world-generation/requirements-test.txt
      - run: python -m pip install -r tooling/world-generation/requirements-test.txt
      # KNOWN RED on main, all water-owned, all held rather than moved out of the
      # blocking job (owner, 2026-09-09) — see docs/research/rendering/water-handoff.md.
      # The suites are not broken; do not xfail, quarantine or weaken them.
      #   * test_blueprint.py::test_live_dir_validates (and, on some builds,
      #     test_minor_waterways.py::test_no_berth_is_refused_in_the_published_network)
      #     — the Sap-Tapping berth stands on dry ground in the published water.
      #   * test_water_invariants.py::test_no_extension_cell_stands_above_its_own_water
      #     — 80 942 cells (2.434 km2). The class raster on disk was baked before
      #     `CLASS_EXT_RISE_M` existed (its `klass` meta has no `extRiseM`); it goes
      #     green on the next `compile_water`.
      #   * test_water_invariants.py::…boat_lane_carries_a_hull… — 122 m of
      #     route.boat.blackrose-lilmoth crosses a marsh flat that is dry in BOTH
      #     seasons. Owner call: declare the carry or make the flat water.
      # OWNER OVERRIDE, 2026-09-09, FOR THIS DEPLOY ONLY — REVERT AFTER.
      # The owner authorised shipping over known, named gate failures so they
      # can walk the province while the fixes land: "I am happy to override any
      # 'gate' issues in the same way on this occasion (with things flagged to
      # me appropriately and added to your list to fix if necessary)."
      # The step still RUNS and still shows RED, so nothing is hidden; it just
      # no longer stops the deploy. Four failures are outstanding:
      #   * test_blueprint::test_live_dir_validates and
      #     test_blueprint::test_door_must_sit_on_the_side_it_claims — two
      #     Lilmoth doors whose piece entrance (260 deg) and parcel footprint
      #     edge (153 deg) disagree by 107 deg. Real, being fixed.
      #   * test_macro_plot::test_the_solve_keeps_every_committed_cell — the
      #     plot/carve/flood loop; each rebuild invalidates a place or two.
      #   * test_vegetation_ladder::test_delivered_ladder — the density ladder
      #     against the newly scattered bundles.
      # DELETE continue-on-error the moment those four are green.
      - run: npm run test:placement
        continue-on-error: true
      # The slow split re-grades the whole province from the vault rasters. It
      # skips where the vault is absent (that includes this runner), so it is
      # wired here to stop it drifting, not as a CI-side measurement.
      - run: npm run test:placement:slow
      # The half of the connector/footprint evidence chain that PRODUCES the
      # measurements consumed by the placement suite (97 G19).
      - run: npm run test:pipeline
      # The water compiler's acceptance suite (decision 0047) — rivers reach the
      # sea, no cell hovers, a fall is a cliff, every published boat lane
      # carries a hull. It gated NOTHING until 2026-09-09: it was in none of the
      # four CI commands, so the whole water contract had never blocked a
      # deploy. Wired here, in the Python job, because these modules import
      # numpy/scipy and the Node build job has neither.
      #
      # Its province-level half needs the asset vault and SKIPS on this runner,
      # exactly as `test:placement:slow` does — wired to stop it drifting, and
      # the measurement happens on a machine that has the world. `test_water.py`
      # runs its synthetic worlds here for real, and so does
      # `test_reroute_lanes.py`, which needs no data at all.
      - run: npm run test:water

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A clean runner clone is also the proof that nothing depends on
      # sibling-repository paths or the local asset vault.
      - run: npm ci
      # Both gates fan out across the workspaces in parallel. `npm ci` has just
      # replaced node_modules, so the incremental typecheck build-info caches
      # under each workspace's node_modules/.cache are gone: CI always runs the
      # full, cold check.
      - run: npm test
      - run: npm run typecheck
      # Every asset pool we ship from must be credited in the root README, in
      # the change that ships it (module 90 §73). Pure-stdlib, no vault needed.
      - name: Credits check
        run: python3 -m worldgen.check_credits
        working-directory: tooling/world-generation
      - run: npm run build
      # Compose the Pages site: combat sandbox at the root path (the playable
      # build until apps/game is real), world studio under /studio/.
      - name: Compose site
        run: |
          mkdir -p site/studio
          cp -r apps/combat-sandbox/dist/* site/
          cp -r apps/world-studio/dist/* site/studio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, placement-tests]
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
