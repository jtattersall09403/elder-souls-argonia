name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A clean runner clone is also the proof that nothing depends on
      # sibling-repository paths or the local asset vault.
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # Compose the Pages site: combat sandbox at the root path (the playable
      # build until apps/game is real), world studio under /studio/.
      - name: Compose site
        run: |
          mkdir -p site/studio
          cp -r apps/combat-sandbox/dist/* site/
          cp -r apps/world-studio/dist/* site/studio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
